<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Car Trends</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#e63946;--link:#58a6ff;
  --up:#3fb950;--down:#f85149;--flat:#8b949e;
  --radius:12px;--font:Inter,Segoe UI,system-ui,sans-serif;
  --mono:JetBrains Mono,SF Mono,ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 72px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:16px}
header h1{margin:0;font-size:1.65rem;font-weight:650;letter-spacing:-.02em}
header .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.badge{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.callout{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.callout .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.callout .v{font-size:.95rem;font-weight:600}
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 14px;border-top:3px solid var(--card-accent,#58a6ff)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{margin:0;font-size:1.15rem;font-weight:650}
.card-head .sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.totals{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline}
.total-n{font-size:2rem;font-weight:700;letter-spacing:-.03em;font-family:var(--mono)}
.delta{font-family:var(--mono);font-size:.85rem;font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--flat)}
.meta{color:var(--muted);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.variant{font-weight:550}
.card-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;padding-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.85rem;color:var(--link)}
.btn:hover{border-color:var(--link);text-decoration:none}
.moved{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted)}
.chip strong{color:var(--text);font-weight:600}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Car Trends</h1>
      <div class="sub" id="header-sub">Loading…</div>
    </div>
    <div class="badge" id="gen-badge"></div>
  </header>

  <section class="callouts" id="global-callouts"></section>
  <section class="cards" id="cards"></section>

  <footer>
    Detail dashboards have full charts, filters, and listing tables.
    Relative links: <code>ferrari-488-f8.html</code>, <code>mclaren-lt.html</code>, <code>ford-gt-gen1.html</code>.
    Overview is a high-level day-over-day snapshot across all categories.
  </footer>
</div>

<script>
(function(){
  const raw = document.getElementById('overview-data').textContent;
  const DATA = JSON.parse(raw);

  function fmtMoney(n){
    if(n==null || n===undefined) return '—';
    return '$' + Number(n).toLocaleString('en-US');
  }
  function fmtMiles(n){
    if(n==null || n===undefined) return '—';
    return Number(n).toLocaleString('en-US') + ' mi';
  }
  function fmtCount(n){
    if(n==null || n===undefined) return '—';
    return Number(n).toLocaleString('en-US');
  }
  function deltaClass(d){
    if(d==null || d===undefined) return 'flat';
    if(d>0) return 'up';
    if(d<0) return 'down';
    return 'flat';
  }
  function deltaArrow(d){
    if(d==null || d===undefined) return '';
    if(d>0) return '↑';
    if(d<0) return '↓';
    return '→';
  }
  function fmtDeltaCount(d){
    if(d==null || d===undefined) return '<span class="delta flat">n/a</span>';
    if(d===0) return '<span class="delta flat">→ 0</span>';
    const sign = d>0 ? '+' : '';
    return `<span class="delta ${deltaClass(d)}">${deltaArrow(d)} ${sign}${d}</span>`;
  }
  function fmtDeltaAsk(d){
    if(d==null || d===undefined) return '<span class="delta flat">n/a</span>';
    if(d===0) return '<span class="delta flat">→ $0</span>';
    const sign = d>0 ? '+' : '−';
    const abs = Math.abs(d).toLocaleString('en-US');
    return `<span class="delta ${deltaClass(d)}">${deltaArrow(d)} ${sign}$${abs}</span>`;
  }
  function fmtDeltaAskPlain(d){
    if(d==null) return 'n/a';
    if(d===0) return '→ $0';
    const sign = d>0 ? '+' : '−';
    return `${deltaArrow(d)} ${sign}$${Math.abs(d).toLocaleString('en-US')}`;
  }

  const dates = (DATA.snapshot_dates||[]).join(' · ') || '—';
  document.getElementById('header-sub').textContent =
    'Latest snapshot' + ((DATA.snapshot_dates||[]).length>1 ? 's' : '') + ': ' + dates;
  document.getElementById('gen-badge').textContent = 'Built ' + (DATA.generated_at||'');

  // Global "what moved" from all category callouts
  const global = document.getElementById('global-callouts');
  const allAsk = [];
  const allCnt = [];
  (DATA.categories||[]).forEach(c=>{
    (c.callouts||[]).forEach(x=>{
      if(x.type==='median_ask') allAsk.push({...x, cat:c.title});
      if(x.type==='count') allCnt.push({...x, cat:c.title});
    });
  });
  let ghtml = '';
  if(allAsk.length){
    const t = allAsk.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
    ghtml += `<div class="callout"><div class="k">Biggest median ask move</div><div class="v">${t.cat} · ${t.variant}: <span class="delta ${deltaClass(t.delta)}">${fmtDeltaAskPlain(t.delta)}</span></div></div>`;
  }
  if(allCnt.length){
    const t = allCnt.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
    const sign = t.delta>0?'+':'';
    ghtml += `<div class="callout"><div class="k">Largest listing count change</div><div class="v">${t.cat} · ${t.variant}: <span class="delta ${deltaClass(t.delta)}">${deltaArrow(t.delta)} ${sign}${t.delta}</span> (${fmtCount(t.from)} → ${fmtCount(t.to)})</div></div>`;
  }
  if(!ghtml){
    ghtml = `<div class="callout"><div class="k">What moved</div><div class="v meta">No day-over-day comparison available yet for some categories.</div></div>`;
  }
  global.innerHTML = ghtml;

  const cards = document.getElementById('cards');
  cards.innerHTML = (DATA.categories||[]).map(c=>{
    if(!c.available){
      return `<article class="card" style="--card-accent:${c.accent}"><div class="card-head"><div><h2>${c.title}</h2><div class="sub">${c.subtitle||''}</div></div></div><div class="empty">${c.error||'No data'}</div></article>`;
    }
    const priorNote = c.prior_date
      ? `vs ${c.prior_date}`
      : 'no prior day';
    const rows = (c.variants||[]).map(v=>`
      <tr>
        <td class="variant">${v.label}</td>
        <td class="num">${fmtCount(v.count)}</td>
        <td class="num">${fmtDeltaCount(v.delta_count)}</td>
        <td class="num">${fmtMoney(v.median_ask)}</td>
        <td class="num">${fmtDeltaAsk(v.delta_ask)}</td>
        <td class="num">${fmtMiles(v.median_miles)}</td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty">No variants</td></tr>`;

    const chips = (c.callouts||[]).map(x=>{
      if(x.type==='median_ask'){
        return `<span class="chip">Ask: <strong>${x.variant}</strong> ${fmtDeltaAskPlain(x.delta)}</span>`;
      }
      const sign = x.delta>0?'+':'';
      return `<span class="chip">Count: <strong>${x.variant}</strong> ${deltaArrow(x.delta)} ${sign}${x.delta}</span>`;
    }).join('');

    return `
    <article class="card" style="--card-accent:${c.accent}">
      <div class="card-head">
        <div>
          <h2>${c.title}</h2>
          <div class="sub">${c.subtitle||''} · snapshot ${c.snapshot_date||'—'} <span class="meta">(${priorNote})</span></div>
        </div>
        <div class="totals">
          <div>
            <div class="meta">Listings</div>
            <div class="total-n">${fmtCount(c.total_listings)}</div>
            <div>${fmtDeltaCount(c.delta_total)} <span class="meta">listings</span></div>
          </div>
          <div>
            <div class="meta">Median ask (variants)</div>
            <div class="total-n" style="font-size:1.35rem">${fmtMoney(c.overall_median_ask)}</div>
            <div>${fmtDeltaAsk(c.delta_median_ask_overall)}</div>
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Variant</th>
            <th class="num">Count</th>
            <th class="num">Δ Count</th>
            <th class="num">Median ask</th>
            <th class="num">Δ Ask</th>
            <th class="num">Median mi</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      ${chips ? `<div class="moved">${chips}</div>` : ''}
      <div class="card-foot">
        <div class="meta">${(c.sources_used||[]).slice(0,6).join(' · ') || ''}${(c.sources_used||[]).length>6?' · …':''}</div>
        <a class="btn" href="${c.detail_href}">Open detail dashboard →</a>
      </div>
    </article>`;
  }).join('');
})();
</script>
</body>
</html>

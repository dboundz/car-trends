<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Car Trends</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#e63946;--link:#58a6ff;
  --up:#3fb950;--down:#f85149;--flat:#8b949e;
  --radius:14px;--font:Inter,Segoe UI,system-ui,sans-serif;
  --mono:JetBrains Mono,SF Mono,ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 72px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:16px}
header h1{margin:0;font-size:1.7rem;font-weight:650;letter-spacing:-.02em}
header .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.badge{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.geo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.geo-pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--muted)}
.geo-pill strong{color:var(--text);font-weight:600}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.callout{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.callout .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.callout .v{font-size:.95rem;font-weight:600}
.brands{display:grid;grid-template-columns:1fr;gap:20px}
.brand{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;border-top:3px solid var(--card-accent,#58a6ff)}
.brand-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.brand-head h2{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.brand-head .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.totals{display:flex;flex-wrap:wrap;gap:22px;align-items:baseline}
.total-n{font-size:2rem;font-weight:700;letter-spacing:-.03em;font-family:var(--mono)}
.delta{font-family:var(--mono);font-size:.85rem;font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--flat)}
.meta{color:var(--muted);font-size:.8rem}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:4px}
.model-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.model-card .name{font-weight:650;font-size:.95rem}
.model-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat .val{font-family:var(--mono);font-size:.88rem;font-variant-numeric:tabular-nums;font-weight:550}
.model-deltas{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px;border-top:1px solid var(--border)}
.brand-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.85rem;color:var(--link);font-weight:550}
.btn:hover{border-color:var(--link);text-decoration:none}
.moved{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted)}
.chip strong{color:var(--text);font-weight:600}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
@media (max-width:640px){
  .models{grid-template-columns:1fr}
  .total-n{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Car Trends</h1>
      <div class="sub" id="header-sub">Loading…</div>
    </div>
    <div class="badge" id="gen-badge"></div>
  </header>

  <div class="geo-bar" id="geo-bar"></div>
  <section class="callouts" id="global-callouts"></section>
  <section class="brands" id="brands"></section>

  <footer>
    Brand sections: Ferrari → McLaren → Ford. Per-model cards show count, median ask, median miles, and day-over-day Δ when a prior day exists.
    Geography: <strong>US + Canada only</strong> (see GEO.md). Detail dashboards:
    <code>ferrari-488-f8.html</code>, <code>mclaren-lt.html</code>, <code>ford-gt-gen1.html</code>.
  </footer>
</div>

"count":12,"median_ask":899990,"median_miles":579,"delta_count":null,"delta_ask":null,"prior_count":null,"prior_median_ask":null}],"callouts":[],"geo":{"raw":26,"kept":25,"dropped":1,"prior":null}}]}</script>
<script>
(function(){
  const raw = document.getElementById('overview-data').textContent;
  const DATA = JSON.parse(raw);

  function fmtMoney(n){
    if(n==null || n===undefined) return '—';
    return '$' + Number(n).toLocaleString('en-US');
  }
  function fmtMiles(n){
    if(n==null || n===undefined) return '—';
    return Number(n).toLocaleString('en-US') + ' mi';
  }
  function fmtCount(n){
    if(n==null || n===undefined) return '—';
    return Number(n).toLocaleString('en-US');
  }
  function deltaClass(d){
    if(d==null || d===undefined) return 'flat';
    if(d>0) return 'up';
    if(d<0) return 'down';
    return 'flat';
  }
  function deltaArrow(d){
    if(d==null || d===undefined) return '';
    if(d>0) return '↑';
    if(d<0) return '↓';
    return '→';
  }
  function fmtDeltaCount(d){
    if(d==null || d===undefined) return '<span class="delta flat">n/a</span>';
    if(d===0) return '<span class="delta flat">→ 0</span>';
    const sign = d>0 ? '+' : '';
    return `<span class="delta ${deltaClass(d)}">${deltaArrow(d)} ${sign}${d}</span>`;
  }
  function fmtDeltaAsk(d){
    if(d==null || d===undefined) return '<span class="delta flat">n/a</span>';
    if(d===0) return '<span class="delta flat">→ $0</span>';
    const sign = d>0 ? '+' : '−';
    const abs = Math.abs(d).toLocaleString('en-US');
    return `<span class="delta ${deltaClass(d)}">${deltaArrow(d)} ${sign}$${abs}</span>`;
  }
  function fmtDeltaAskPlain(d){
    if(d==null) return 'n/a';
    if(d===0) return '→ $0';
    const sign = d>0 ? '+' : '−';
    return `${deltaArrow(d)} ${sign}$${Math.abs(d).toLocaleString('en-US')}`;
  }

  const dates = (DATA.snapshot_dates||[]).join(' · ') || '—';
  document.getElementById('header-sub').textContent =
    'Latest snapshot' + ((DATA.snapshot_dates||[]).length>1 ? 's' : '') + ': ' + dates
    + ' · ' + (DATA.geography || 'US + Canada');
  document.getElementById('gen-badge').textContent = 'Built ' + (DATA.generated_at||'');

  const gt = DATA.geo_totals || {};
  document.getElementById('geo-bar').innerHTML =
    `<span class="geo-pill"><strong>Geography</strong> US + Canada</span>`
    + `<span class="geo-pill">Raw rows <strong>${fmtCount(gt.raw)}</strong></span>`
    + `<span class="geo-pill">Kept <strong>${fmtCount(gt.kept)}</strong></span>`
    + `<span class="geo-pill">Dropped <strong>${fmtCount(gt.dropped)}</strong></span>`;

  const global = document.getElementById('global-callouts');
  const allAsk = [];
  const allCnt = [];
  (DATA.categories||[]).forEach(c=>{
    (c.callouts||[]).forEach(x=>{
      if(x.type==='median_ask') allAsk.push({...x, cat:c.brand||c.title});
      if(x.type==='count') allCnt.push({...x, cat:c.brand||c.title});
    });
  });
  let ghtml = '';
  if(allAsk.length){
    const t = allAsk.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
    ghtml += `<div class="callout"><div class="k">Biggest median ask move</div><div class="v">${t.cat} · ${t.variant}: <span class="delta ${deltaClass(t.delta)}">${fmtDeltaAskPlain(t.delta)}</span></div></div>`;
  }
  if(allCnt.length){
    const t = allCnt.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
    const sign = t.delta>0?'+':'';
    ghtml += `<div class="callout"><div class="k">Largest listing count change</div><div class="v">${t.cat} · ${t.variant}: <span class="delta ${deltaClass(t.delta)}">${deltaArrow(t.delta)} ${sign}${t.delta}</span> (${fmtCount(t.from)} → ${fmtCount(t.to)})</div></div>`;
  }
  if(!ghtml){
    ghtml = `<div class="callout"><div class="k">What moved</div><div class="v meta">No day-over-day comparison available yet for some brands.</div></div>`;
  }
  global.innerHTML = ghtml;

  const brands = document.getElementById('brands');
  brands.innerHTML = (DATA.categories||[]).map(c=>{
    if(!c.available){
      return `<article class="brand" style="--card-accent:${c.accent}"><div class="brand-head"><div><h2>${c.brand||c.title}</h2><div class="sub">${c.subtitle||''}</div></div></div><div class="empty">${c.error||'No data'}</div></article>`;
    }
    const priorNote = c.prior_date ? `vs ${c.prior_date}` : 'no prior day';
    const geo = c.geo || {};
    const modelCards = (c.variants||[]).map(v=>`
      <div class="model-card">
        <div class="name">${v.label}</div>
        <div class="model-stats">
          <div class="stat"><div class="lbl">Count</div><div class="val">${fmtCount(v.count)}</div></div>
          <div class="stat"><div class="lbl">Median ask</div><div class="val">${fmtMoney(v.median_ask)}</div></div>
          <div class="stat"><div class="lbl">Median mi</div><div class="val">${fmtMiles(v.median_miles)}</div></div>
          <div class="stat"><div class="lbl">Δ Ask</div><div class="val">${fmtDeltaAsk(v.delta_ask)}</div></div>
        </div>
        <div class="model-deltas">
          <span class="meta">Δ count</span> ${fmtDeltaCount(v.delta_count)}
        </div>
      </div>`).join('') || `<div class="empty">No models</div>`;

    const chips = (c.callouts||[]).map(x=>{
      if(x.type==='median_ask'){
        return `<span class="chip">Ask: <strong>${x.variant}</strong> ${fmtDeltaAskPlain(x.delta)}</span>`;
      }
      const sign = x.delta>0?'+':'';
      return `<span class="chip">Count: <strong>${x.variant}</strong> ${deltaArrow(x.delta)} ${sign}${x.delta}</span>`;
    }).join('');

    return `
    <article class="brand" style="--card-accent:${c.accent}">
      <div class="brand-head">
        <div>
          <h2>${c.brand||c.title}</h2>
          <div class="sub">${c.subtitle||''} · snapshot ${c.snapshot_date||'—'} <span class="meta">(${priorNote})</span></div>
          <div class="meta" style="margin-top:4px">US/CA filter: kept ${fmtCount(geo.kept)} / raw ${fmtCount(geo.raw)} · dropped ${fmtCount(geo.dropped)}</div>
        </div>
        <div class="totals">
          <div>
            <div class="meta">Brand listings</div>
            <div class="total-n">${fmtCount(c.total_listings)}</div>
            <div>${fmtDeltaCount(c.delta_total)} <span class="meta">listings</span></div>
          </div>
          <div>
            <div class="meta">Overall median ask</div>
            <div class="total-n" style="font-size:1.35rem">${fmtMoney(c.overall_median_ask)}</div>
            <div>${fmtDeltaAsk(c.delta_median_ask_overall)}</div>
          </div>
        </div>
      </div>
      <div class="models">${modelCards}</div>
      ${chips ? `<div class="moved">${chips}</div>` : ''}
      <div class="brand-foot">
        <div class="meta">Models as rows/cards · DoD when prior day exists</div>
        <a class="btn" href="${c.detail_href}">Open ${c.brand||c.title} detail →</a>
      </div>
    </article>`;
  }).join('');
})();
</script>
</body>
</html>
